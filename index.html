<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0070bd">
<title>土城生活小幫手</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: a patient grandson — big words, short sentences, one answer at a time.
IDEA: Taipei Metro signage: line-coloured strips that tell you where to change trains.
PICTURE: the answer itself — a coloured ride strip per line with big "坐幾站" numbers; food as menu cards.
COLOUR and TYPE: metro blue frame, each MRT line in its own colour, orange for "現在有開"; Noto Sans TC.
LAYOUT: two huge tabs on top; one column below.
*/
:root{color-scheme:light dark;--bg:light-dark(#f4f7fb,#0c1522);--card:light-dark(#fff,#16233a);--ink:light-dark(#10213a,#eef3fa);--soft:light-dark(#4a5a70,#b7c4d6);--blue:#0070bd;--blue2:light-dark(#e3f0fa,#13314f);--hot:#e8590c;--line:light-dark(#d5deea,#2a3b57);--ok:#2b8a3e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:clip}
.wrap{max-width:860px;margin:0 auto;padding:0 max(4vw,12px) 70px}
header{background:var(--blue);color:#fff;padding:16px max(4vw,12px) 0;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.15)}
header h1{margin:0 auto 10px;max-width:860px;font-size:24px;font-weight:900}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:860px;margin:0 auto}
.tabs button{font-family:inherit;font-size:26px;font-weight:900;min-height:66px;border:0;border-radius:16px 16px 0 0;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink)}
.tabs button:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--hot);outline-offset:2px}
[hidden]{display:none!important}
section.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px clamp(14px,3vw,24px);margin-top:16px}
h2{font-size:28px;line-height:1.2;margin:0 0 10px;font-weight:900}
h3{font-size:23px;margin:4px 0 8px}
.note{color:var(--soft);font-size:16px}
label.big{display:block;font-size:22px;font-weight:700;margin-bottom:8px}
.search{display:flex;gap:8px}
.search input{flex:1;font:inherit;font-size:24px;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);min-height:62px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:60px;padding:8px 18px;border-radius:14px;background:var(--blue);color:#fff;text-decoration:none;font-family:inherit;font-weight:700;font-size:20px;border:0;cursor:pointer;margin:4px 6px 4px 0;text-align:center}
.btn.hot{background:var(--hot)}.btn.ghost{background:var(--blue2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{font-family:inherit;font-size:19px;font-weight:700;min-height:50px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.from{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:18px}
.from select{font:inherit;font-size:19px;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:48px}
/* ride steps */
.sum{font-size:22px;font-weight:700;margin:6px 0 12px}
.leg{border-left:14px solid var(--c,#0070bd);border-radius:12px;background:var(--blue2);padding:12px 14px;margin:10px 0}
.leg .ln{display:inline-block;background:var(--c);color:#fff;font-weight:900;border-radius:8px;padding:0 10px;font-size:18px}
.leg .dir{font-size:23px;font-weight:900;margin:6px 0 2px}
.leg .n{font-size:20px}
.leg .n b{font-size:30px;color:var(--hot)}
.walk{padding:8px 14px;margin:6px 0;font-size:19px;border-left:6px dashed var(--line)}
.xfer{font-weight:900;color:var(--hot);padding:4px 14px;font-size:20px}
.bus{border-left:14px solid var(--ok);border-radius:12px;background:light-dark(#ebfbee,#13321c);padding:12px 14px;margin:10px 0}
/* food */
.food{display:grid;gap:12px;margin-top:12px}
.fc{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.fc .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fc h3{margin:0;font-size:24px;line-height:1.25}
.fc .tag{flex:none;font-size:15px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--blue2)}
.fc .eat{font-size:20px;margin:6px 0}
.fc .eat b{color:var(--hot)}
.fc .meta{font-size:17px;color:var(--soft)}
.open{color:var(--ok);font-weight:900}.closed{color:#c92a2a;font-weight:900}
.fc .acts{margin-top:8px}.fc .btn{min-height:52px;font-size:18px}
</style>
</head>
<body>
<header>
<h1>🏠 爺爺奶奶的土城小幫手</h1>
<div class="tabs" role="tablist">
<button role="tab" id="tab-go" aria-selected="true" aria-controls="p-go">🚇 交通</button>
<button role="tab" id="tab-food" aria-selected="false" aria-controls="p-food">🍜 美食</button>
</div>
</header>

<div class="wrap">
<!-- ================= 交通 ================= -->
<div id="p-go" role="tabpanel">
<section class="card">
<label class="big" for="q">想去哪裡玩？打字或按下面的地方</label>
<form class="search" id="f"><input id="q" type="search" placeholder="例如：台北101、西門町、淡水" autocomplete="off"><button class="btn hot" type="submit">查</button></form>
<div class="chips" id="pop"></div>
<div class="from"><span>從哪一站出發：</span><select id="start"></select></div>
</section>
<section class="card" id="res" hidden aria-live="polite"></section>
</div>

<!-- ================= 美食 ================= -->
<div id="p-food" role="tabpanel" hidden>
<section class="card">
<h2>🍜 家附近好吃的</h2>
<p class="note">都在海山站、學府路、裕民路一帶。綠色「現在有開」是照手機時間自動算的。</p>
<div class="chips" id="fcat"></div>
</section>
<div class="food" id="flist"></div>
<p class="note">店家資料整理自食尚玩家（2023）、蕃薯藤旅遊（2019）等美食報導，營業時間和價格可能已經改變，出門前可以先按「地圖」看最新資訊。</p>
</div>
</div>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOME='新北市土城區學府路一段98巷30之1號';
const gdir=(d,m)=>`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(HOME)}&destination=${encodeURIComponent(d)}&travelmode=${m}`;
const gsearch=q=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;

/* ---------- 分頁 ---------- */
const tabs=[['tab-go','p-go'],['tab-food','p-food']];
const show=id=>{tabs.forEach(([t,p])=>{const on=t===id;$(t).setAttribute('aria-selected',on);$(p).hidden=!on});try{localStorage.setItem('tab',id)}catch(e){}window.scrollTo(0,0)};
tabs.forEach(([t])=>$(t).addEventListener('click',()=>show(t)));
try{const t=localStorage.getItem('tab');if(t&&$(t))show(t)}catch(e){}

/* ---------- 台北捷運路網 ---------- */
const LINES=[
 {n:'板南線',c:'#0070bd',s:'頂埔 永寧 土城 海山 亞東醫院 府中 板橋 新埔 江子翠 龍山寺 西門 台北車站 善導寺 忠孝新生 忠孝復興 忠孝敦化 國父紀念館 市政府 永春 後山埤 昆陽 南港 南港展覽館'},
 {n:'淡水信義線',c:'#e3002c',s:'象山 台北101/世貿 信義安和 大安 大安森林公園 東門 中正紀念堂 台大醫院 台北車站 中山 雙連 民權西路 圓山 劍潭 士林 芝山 明德 石牌 唭哩岸 奇岩 北投 復興崗 忠義 關渡 竹圍 紅樹林 淡水'},
 {n:'新北投支線',c:'#fd92a3',s:'北投 新北投'},
 {n:'松山新店線',c:'#008659',s:'新店 新店區公所 七張 大坪林 景美 萬隆 公館 台電大樓 古亭 中正紀念堂 小南門 西門 北門 中山 松江南京 南京復興 台北小巨蛋 南京三民 松山'},
 {n:'小碧潭支線',c:'#cfdb00',s:'七張 小碧潭'},
 {n:'中和新蘆線',c:'#f8b61c',s:'南勢角 景安 永安市場 頂溪 古亭 東門 忠孝新生 松江南京 行天宮 中山國小 民權西路 大橋頭 三重國小 三和國中 徐匯中學 三民高中 蘆洲'},
 {n:'中和新蘆線',c:'#f8b61c',s:'南勢角 景安 永安市場 頂溪 古亭 東門 忠孝新生 松江南京 行天宮 中山國小 民權西路 大橋頭 台北橋 菜寮 三重 先嗇宮 頭前庄 新莊 輔大 丹鳳 迴龍'},
 {n:'文湖線',c:'#c48c31',s:'動物園 木柵 萬芳社區 萬芳醫院 辛亥 麟光 六張犁 科技大樓 大安 忠孝復興 南京復興 中山國中 松山機場 大直 劍南路 西湖 港墘 文德 內湖 大湖公園 葫洲 東湖 南港軟體園區 南港展覽館'},
 {n:'環狀線',c:'#ffdb00',s:'大坪林 十四張 秀朗橋 景平 景安 中和 橋和 中原 板新 板橋 新埔民生 頭前庄 幸福 新北產業園區'},
 {n:'機場捷運',c:'#8246af',s:'台北車站 三重 新北產業園區 新莊副都心 泰山 泰山貴和 體育大學 長庚醫院 林口 山鼻 坑口 機場第一航廈 機場第二航廈'}
].map((l,i)=>({...l,id:i,st:l.s.split(' ')}));
const ADJ={};
LINES.forEach(l=>l.st.forEach((s,i)=>{ADJ[s]=ADJ[s]||[];if(i>0)ADJ[s].push([l.st[i-1],l.id]);if(i<l.st.length-1)ADJ[s].push([l.st[i+1],l.id])}));
const ALL=Object.keys(ADJ);

// 最少轉乘的路線（每站 1 分、每次轉車 6 分）
function route(a,b){
 const key=(s,ln)=>s+'|'+(ln==null?'':LINES[ln].n);
 const dist={},prev={},Q=[[0,a,null]];dist[key(a,null)]=0;
 while(Q.length){
  Q.sort((x,y)=>x[0]-y[0]);const [d,s,ln]=Q.shift();
  if(s===b){const path=[];let k=key(s,ln),cur=[s,ln];while(cur){path.unshift(cur);cur=prev[key(cur[0],cur[1])]}return path}
  if(d>dist[key(s,ln)])continue;
  for(const [t,l2] of ADJ[s]){const nd=d+1+(ln!=null&&LINES[ln].n!==LINES[l2].n?6:0);const k=key(t,l2);
   if(dist[k]==null||nd<dist[k]){dist[k]=nd;prev[k]=[s,ln];Q.push([nd,t,l2])}}
 }return null;
}
// 把路線整理成「坐哪條線、往哪個方向、坐幾站」
function legs(path){
 const out=[];
 for(let i=1;i<path.length;i++){const [s,l]=path[i],from=path[i-1][0];const last=out[out.length-1];
  if(last&&LINES[last.l].n===LINES[l].n){last.to=s;last.n++;last.lines.add(l)}else out.push({l,from,to:s,n:1,lines:new Set([l])})}
 return out.map(g=>{
  const name=LINES[g.l].n;const ends=new Set();
  g.lines.forEach(id=>{const st=LINES[id].st;if(!st.includes(g.from)||!st.includes(g.to))return;ends.add(st.indexOf(g.to)>st.indexOf(g.from)?st[st.length-1]:st[0])});
  // 中和新蘆線兩條分支共用的一段：兩個方向都可以坐
  const trunk=LINES[5].st.slice(0,12);
  if(name==='中和新蘆線'&&trunk.includes(g.from)&&trunk.includes(g.to)&&trunk.indexOf(g.to)>trunk.indexOf(g.from)){ends.clear();ends.add('蘆洲 或 迴龍')}
  return{name,c:LINES[g.l].c,from:g.from,to:g.to,n:g.n,dir:[...ends][0]||''};
 });
}

/* ---------- 地名 → 捷運站 ---------- */
const PLACES={
 '台北101':['台北101/世貿'],'101':['台北101/世貿'],'世貿':['台北101/世貿'],'信義商圈':['市政府','出站就是信義商圈，百貨公司很多。'],'象山':['象山','出站走到象山步道入口約 10 分鐘，山路有很多樓梯，量力而為。'],
 '西門町':['西門','6 號出口出來就是西門町。'],'士林夜市':['劍潭','1 號出口過馬路就是士林夜市。'],'故宮':['士林','出站後換坐公車到故宮（站牌寫「故宮博物院」）。'],
 '動物園':['動物園','出站就到動物園門口，園區很大可以坐園內遊園車。'],'貓空':['動物園','出站往貓空纜車站走約 5 分鐘，坐纜車上山。'],
 '淡水老街':['淡水','出站往河邊走就是老街。'],'漁人碼頭':['淡水','出站坐紅26 公車或渡船到漁人碼頭。'],
 '中正紀念堂':['中正紀念堂','5 號出口出來就是。'],'自由廣場':['中正紀念堂'],'總統府':['台大醫院'],'228公園':['台大醫院'],'二二八公園':['台大醫院'],
 '龍山寺':['龍山寺','1 號出口出來就看到龍山寺。'],'國父紀念館':['國父紀念館'],'行天宮':['行天宮','4 號出口走一下就到。'],
 '饒河夜市':['松山','5 號出口出來就是饒河夜市和慈祐宮。'],'寧夏夜市':['雙連','出站往民生西路走約 8 分鐘。'],'大稻埕':['北門','出站往迪化街方向走約 10 分鐘。'],'迪化街':['北門','出站往迪化街方向走約 10 分鐘。'],
 '北投溫泉':['新北投','出站就是溫泉區和北投公園。'],'天母':['芝山','出站換公車到天母。'],'榮總':['石牌','出站有醫院接駁車到台北榮總。'],
 '師大夜市':['台電大樓'],'公館夜市':['公館'],'台大':['公館'],'永康街':['東門','5 號出口出來就是永康街。'],'東區':['忠孝復興'],'SOGO':['忠孝復興'],'小巨蛋':['台北小巨蛋'],
 '桃園機場':['機場第一航廈','在台北車站換機場捷運（紫色），要另外買票或刷卡，先問站務人員比較保險。'],'林口長庚':['長庚醫院'],'碧潭':['新店','出站往河邊走就是碧潭。'],
 '環球購物中心':['中和'],'中和':['南勢角'],'永和':['頂溪'],'樂華夜市':['頂溪','出站走約 5 分鐘。'],'林家花園':['府中','出站走約 10 分鐘。'],'南雅夜市':['府中'],
 '新板特區':['板橋'],'大遠百':['新埔'],'美麗華':['劍南路'],'花博':['圓山'],'陽明山':['劍潭','出站換坐「紅5」公車上陽明山。'],'大湖公園':['大湖公園'],'新莊老街':['新莊'],
 '亞東醫院':['亞東醫院','出站就到醫院。'],'台北車站':['台北車站'],'板橋車站':['板橋'],
 '土城醫院':['土城','從 1 號或 3 號出口出去，坐醫院的免費接駁車，約 10 分鐘（班次可能調整）。'],
 '三峽':['頂埔','在頂埔站裡跟著牌子換「三鶯線」，往三峽方向坐，不用出站。'],'三峽老街':['頂埔','在頂埔站裡換「三鶯線」往三峽方向，不用出站。'],
 '鶯歌':['頂埔','在頂埔站裡換「三鶯線」往鶯歌方向，坐到最後一站「鶯歌」附近；鶯歌老街還要走一段。'],'鶯歌老街':['頂埔','在頂埔站裡換「三鶯線」往鶯歌方向，不用出站。'],
 '回家':['海山','從海山站走回家約 10～15 分鐘，累了就坐計程車。'],'家':['海山','從海山站走回家約 10～15 分鐘。']
};
// 有查證過的直達公車
const BUS={
 '西門':'在「捷運土城站」3 號出口旁坐 <b>706</b>（西門－三峽），往西門方向，不用轉車。',
 '頂埔':'要去三峽也可以在「捷運土城站」1、2 號出口旁坐 <b>706</b>（西門－三峽）往三峽方向。',
 '土城':'坐捷運最方便；公車可以在家附近問站牌。'
};
const POP=['台北101','西門町','台北車站','士林夜市','淡水老街','中正紀念堂','龍山寺','動物園','北投溫泉','板橋車站','三峽老街','鶯歌老街','土城醫院','亞東醫院','回家'];

const sn=s=>s.endsWith('站')?s:s+'站';
const norm=s=>s.replace(/\s/g,'').replace(/^(捷運|臺北|台北市)/,'').replace(/臺/g,'台').replace(/(捷運站|站)$/,'');
function find(q){
 const k=norm(q);if(!k)return null;
 if(PLACES[k])return{dest:k,st:PLACES[k][0],tip:PLACES[k][1]};
 if(ADJ[k])return{dest:sn(k),st:k};
 for(const p in PLACES)if(k.includes(p)||(p.length>=2&&p.includes(k)))return{dest:p,st:PLACES[p][0],tip:PLACES[p][1]};
 const s=ALL.find(s=>s.includes(k)||k.includes(s.replace('/世貿','')));
 return s?{dest:sn(s),st:s}:{dest:q,st:null};
}

$('start').innerHTML=['海山','土城','永寧','頂埔','亞東醫院','板橋'].map(s=>`<option ${s==='海山'?'selected':''}>${s}</option>`).join('');
$('pop').innerHTML=POP.map(p=>`<button type="button" data-q="${esc(p)}">${esc(p)}</button>`).join('');
$('pop').addEventListener('click',e=>{const b=e.target.closest('button');if(b){$('q').value=b.dataset.q;go()}});
$('f').addEventListener('submit',e=>{e.preventDefault();go()});
$('start').addEventListener('change',()=>{if($('q').value)go()});

let speakText='';
function go(){
 const q=$('q').value.trim();if(!q)return;
 const r=find(q),start=$('start').value,box=$('res');
 let h=`<h2>去 ${esc(r.dest)}</h2>`;speakText=`去${r.dest}。`;
 // ---- 捷運 ----
 h+='<h3>🚇 捷運怎麼坐</h3>';
 if(!r.st){h+=`<p>我不知道「${esc(q)}」在哪一個捷運站附近，請按下面的綠色按鈕，讓地圖幫你查。</p>`}
 else if(r.st===start){h+=`<p class="sum">就在「${esc(sn(start))}」，不用坐捷運！</p>`;if(r.tip)h+=`<div class="walk">👣 ${esc(r.tip)}</div>`;speakText+=`就在${start}站。${r.tip||''}`}
 else{
  const L=legs(route(start,r.st)),stops=L.reduce((a,g)=>a+g.n,0),mins=Math.round(stops*2.2+(L.length-1)*6);
  h+=`<p class="sum">大約 ${mins} 分鐘，${L.length>1?`要換 ${L.length-1} 次車`:'不用換車'}。</p>`;
  if(start==='海山')h+='<div class="walk">👣 從家走到「海山站」（約 10～15 分鐘）。進站刷敬老卡。</div>';
  speakText+=`大約${mins}分鐘。`;
  L.forEach((g,i)=>{
   if(i>0){h+=`<div class="xfer">🔁 在「${esc(sn(g.from))}」下車，換 ${esc(g.name)}（跟著牌子走，不用出站）</div>`;speakText+=`在${sn(g.from)}下車，換${g.name}。`}
   h+=`<div class="leg" style="--c:${g.c}"><span class="ln">${esc(g.name)}</span><div class="dir">坐「往 ${esc(g.dir)}」方向</div><div class="n">坐 <b>${g.n}</b> 站，到「${esc(sn(g.to))}」下車</div></div>`;
   speakText+=`第${i+1}段，坐${g.name}，往${g.dir}方向，坐${g.n}站，到${sn(g.to)}下車。`;
  });
  if(r.tip){h+=`<div class="walk">👣 ${esc(r.tip)}</div>`;speakText+=r.tip}
 }
 // ---- 公車 ----
 h+='<h3 style="margin-top:18px">🚌 公車怎麼坐</h3>';
 const bus=r.st&&BUS[r.st];
 if(bus){h+=`<div class="bus">${bus}</div>`}
 h+=`<div class="bus">按下面綠色按鈕，地圖會列出<b>幾號公車、在哪一站坐、幾分鐘後來</b>，照著坐就好。上下車都刷敬老卡（公車半價再扣點數）。</div>`;
 h+=`<a class="btn" style="background:var(--ok)" href="${gdir(r.dest==='回家'||r.dest==='家'?HOME:r.dest,'transit')}">🗺️ 看公車怎麼坐（開地圖）</a>`;
 h+=`<button class="btn hot" type="button" id="say">🔊 唸給我聽</button>`;
 box.innerHTML=h;box.hidden=false;box.scrollIntoView({behavior:'smooth',block:'start'});
 $('say').addEventListener('click',()=>speak(speakText));
}

/* ---------- 唸出來 ---------- */
let voice=null;const pick=()=>{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null};
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\//g,''));u.lang='zh-TW';u.rate=.85;if(voice)u.voice=voice;speechSynthesis.speak(u)}

/* ---------- 美食 ---------- */
// h: 營業時間 [[開,關],...]（24 小時制，小數 .5 = 30 分）；off: 公休（0=星期日）
const FOOD=[

 {n:'兩支北方麵食館',c:'麵飯',eat:'紅燒牛肉麵 <b>180 元</b>（牛肉燉得很軟）、湯包 6 顆 115 元',a:'裕民路129號',h:[[11,14],[17,21]],off:[],t:'02-2262-9888',why:'得過牛肉麵比賽金牌，海山站走路 5 分鐘'},
 {n:'正宗岡山羊肉',c:'麵飯',eat:'羊肉炒麵 <b>95 元</b>、當歸羊大骨湯 100 元（湯可以免費續）',a:'明德路二段72-3號',h:[[11,14],[17,21]],off:[2],t:'02-8273-2526',why:'網友說是土城最好吃的羊肉，冬天補身體'},
 {n:'阿城鵝肉（總店）',c:'麵飯',eat:'鵝肉、清蒸鵝米血 <b>45 元</b>',a:'清水路78號',h:[[11,20]],off:[],t:'02-8261-9747',why:'有名的鵝肉老店'},
 {n:'員山排骨',c:'麵飯',eat:'排骨飯 <b>90 元</b>（附滷蛋，配菜選 3 樣）、炸雞腿 60 元',a:'青雲路182號',h:[[11,13.5],[16.5,19.5]],off:[0,6],t:'02-2261-2611',why:'只開平日，排隊排到馬路上'},
 {n:'啖餅坊手工蛋餅',c:'早餐',eat:'高麗菜蛋餅（手工現桿餅皮，很有飽足感）',a:'裕民路92巷21弄14號',h:[[6,16]],off:[2],why:'生意很好，可以前一天先用 LINE 預訂'},
 {n:'無名早餐店',c:'早餐',eat:'漢堡蛋 + 奶茶（自己做的漢堡肉）',a:'裕民路136巷4弄（轉角）',h:null,off:[1],why:'開了幾十年的露天早餐店'},

 {n:'勝男家',c:'麵飯',eat:'胡麻乾拌麵、紅燒牛肉拉麵',a:'裕民路92巷16弄8號',h:[[11.5,14.5],[17,23]],off:[],t:'02-2265-0058',why:'海山站附近的人氣麵店'},
 {n:'找。漢堡 Found Burger',c:'小吃',eat:'牛肉漢堡、奶油寬麵、法式吐司 40 元',a:'裕民路92巷21弄12號',h:[[11.5,21]],off:[3],why:'週末早上 9 點就開，適合帶孫子去'},
 {n:'海山站檸檬香雞排',c:'小吃',eat:'脆皮檸檬香草雞排',a:'裕民路92巷23弄1號',h:[[16,23]],off:[0],why:'先打電話訂比較不用等'},

 {n:'爆漿蛋餅',c:'早餐',eat:'爆漿蛋餅 <b>40 元</b>',a:'學成路136號',h:null,off:[],why:'銅板價早餐'},
 {n:'工業區烏醋麵',c:'麵飯',eat:'烏醋麵（早餐、午餐）',a:'中央路四段25-7號',h:[[6,14.5]],off:[0],t:'02-2268-7880',why:'在頂埔那邊，坐捷運去頂埔順便吃'}
];
const CATS=['全部','現在有開','早餐','麵飯','小吃','甜點'];
let fc='全部';
const now=()=>{const d=new Date();return{day:d.getDay(),t:d.getHours()+d.getMinutes()/60}};
const status=f=>{if(!f.h)return null;const {day,t}=now();if(f.off.includes(day))return false;return f.h.some(([a,b])=>t>=a&&t<b)};
const fmt=x=>`${Math.floor(x)}:${x%1?'30':'00'}`;
const hours=f=>{const w='日一二三四五六';let s=f.h?f.h.map(([a,b])=>fmt(a)+'～'+fmt(b)).join('、'):'營業時間不確定';if(f.off.length)s+=`（星期${f.off.map(d=>w[d]).join('、')}休息）`;return s};
function drawFood(){
 $('fcat').innerHTML=CATS.map(c=>`<button type="button" aria-pressed="${c===fc}" data-c="${c}">${c==='現在有開'?'🟢 ':''}${c}</button>`).join('');
 const list=FOOD.filter(f=>fc==='全部'||(fc==='現在有開'?status(f)===true:f.c===fc));
 $('flist').innerHTML=list.length?list.map(f=>{const st=status(f);return`<article class="fc">
  <div class="top"><h3>${esc(f.n)}</h3><span class="tag">${esc(f.c)}</span></div>
  <p class="eat">🍽️ ${f.eat}</p>
  <p class="meta">${st===true?'<span class="open">● 現在有開</span>　':st===false?'<span class="closed">● 現在沒開</span>　':''}🕐 ${esc(hours(f))}</p>
  <p class="meta">📍 土城區${esc(f.a)}${f.t?'　☎ '+esc(f.t):''}</p>
  <p class="meta">💬 ${esc(f.why)}</p>
  <div class="acts"><a class="btn" href="${gsearch('土城 '+f.n.replace(/（.*）/,''))}">🗺️ 地圖</a><a class="btn ghost" href="${gdir('新北市土城區'+f.a,'walking')}">🚶 從家走過去</a></div>
 </article>`}).join(''):'<section class="card"><p>現在這個時間沒有店開著，晚一點再看看！</p></section>';
}
$('fcat').addEventListener('click',e=>{const b=e.target.closest('button');if(b){fc=b.dataset.c;drawFood()}});
drawFood();
}
