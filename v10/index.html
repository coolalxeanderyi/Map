<style>
/*
VOICE: a cheerful little helper — warm, playful, never childish to read; big round words.
IDEA: a picture-book sticker album: each answer is a sticker, each MRT line a crayon stripe.
PICTURE: a smiling little blue train mascot (original) puffing hearts in the header.
COLOUR and TYPE: cream paper with soft dots, sky blue, peach pink, mint, butter yellow; rounded 粉圓 / Chiron GoRound.
LAYOUT: bubbly pill tabs, sticker cards with soft shadows, one column.
*/
:root{color-scheme:light;--bg:#fff7ec;--card:#ffffff;--ink:#3d3030;--soft:#7a6a64;--blue:#4a9fe0;--blue2:#e6f3ff;--hot:#ff7a8a;--pink2:#ffe8ec;--mint:#4cc49a;--mint2:#e3f8ef;--sun:#ffd66b;--line:#f1e2d3;--ok:#3cb07f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg) radial-gradient(#ffd9c4 1.6px,transparent 1.8px) 0 0/26px 26px;color:var(--ink);font:20px/1.6 "Huninn","Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:clip}
.wrap{max-width:860px;margin:0 auto;padding:0 max(4vw,12px) 80px}
header{background:linear-gradient(180deg,#8fd0ff,#bfe5ff);padding:12px max(4vw,12px) 0;position:sticky;top:0;z-index:5;border-radius:0 0 28px 28px;box-shadow:0 6px 0 #a9dafc}
.hd{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hd svg{flex:none;width:86px;height:64px}
header h1{margin:0;font-size:25px;line-height:1.2;font-weight:900;color:#20466b}
header h1 small{display:block;font-size:16px;font-weight:700;color:#3b6a92}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:860px;margin:10px auto 0;padding-bottom:12px}
.tabs button{font-family:inherit;font-size:25px;font-weight:900;min-height:62px;border:3px solid #fff;border-radius:999px;background:rgba(255,255,255,.55);color:#20466b;cursor:pointer;transition:transform .15s}
.tabs button[aria-selected=true]{background:#fff;color:var(--hot);box-shadow:0 4px 0 #ffc2cb;transform:translateY(-2px)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--hot);outline-offset:2px}
[hidden]{display:none!important}
section.card{background:var(--card);border-radius:26px;padding:20px clamp(16px,3vw,26px);margin-top:18px;box-shadow:0 6px 0 var(--line),0 10px 24px rgba(214,170,140,.18)}
h2{font-size:28px;line-height:1.2;margin:0 0 10px;font-weight:900}
h3{font-size:23px;margin:6px 0 8px}
.note{color:var(--soft);font-size:16px}
label.big{display:block;font-size:23px;font-weight:900;margin-bottom:10px}
.search{display:flex;gap:8px}
.search input{flex:1;font:inherit;font-size:24px;padding:12px 18px;border-radius:999px;border:3px solid #cfe7fb;background:#fbfdff;color:var(--ink);min-height:62px}
.search input:focus{border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:8px 20px;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;font-family:inherit;font-weight:900;font-size:20px;border:0;cursor:pointer;margin:5px 6px 5px 0;text-align:center;box-shadow:0 4px 0 #2f7fbf;transition:transform .1s}
.btn:active,.chips button:active{transform:translateY(3px);box-shadow:none}
.btn.hot{background:var(--hot);box-shadow:0 4px 0 #e0566a}.btn.ghost{background:var(--blue2);color:#20466b;box-shadow:0 4px 0 #c7e2f8}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.chips button{font-family:inherit;font-size:19px;font-weight:900;min-height:50px;padding:6px 16px;border-radius:999px;border:0;background:var(--c,#fff1d6);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.chips button:nth-child(4n+1){--c:#ffe8ec}.chips button:nth-child(4n+2){--c:#e3f8ef}.chips button:nth-child(4n+3){--c:#e6f3ff}.chips button:nth-child(4n){--c:#fff1d6}
.chips button[aria-pressed=true]{background:var(--hot);color:#fff}
.from{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-size:18px}
.from select{font:inherit;font-size:19px;padding:8px 14px;border-radius:999px;border:3px solid #cfe7fb;background:#fff;color:var(--ink);min-height:48px}
.sum{font-size:22px;font-weight:900;margin:6px 0 12px;background:#fff6d6;border-radius:18px;padding:10px 14px}
.leg{border-radius:20px;background:#fff;border:4px solid var(--c,#0070bd);padding:12px 16px;margin:12px 0;position:relative}
.leg .ln{display:inline-block;background:var(--c);color:#fff;font-weight:900;border-radius:999px;padding:1px 14px;font-size:18px;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.leg .dir{font-size:23px;font-weight:900;margin:6px 0 2px}
.leg .n{font-size:20px}.leg .n b{font-size:32px;color:var(--hot)}
.walk{padding:10px 16px;margin:8px 0;font-size:19px;background:var(--mint2);border-radius:16px}
.xfer{font-weight:900;color:#d9485c;padding:8px 16px;font-size:20px;background:var(--pink2);border-radius:16px;margin:8px 0}
.bus{border-radius:20px;background:var(--mint2);padding:12px 16px;margin:10px 0}
.food{display:grid;gap:14px;margin-top:14px}
.fc{background:var(--card);border-radius:24px;padding:16px 18px;box-shadow:0 6px 0 var(--line),0 10px 20px rgba(214,170,140,.15);position:relative}
.fc .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fc h3{margin:0;font-size:24px;line-height:1.25}
.fc .tag{flex:none;font-size:16px;font-weight:900;border-radius:999px;padding:4px 12px;background:#fff1d6}
.fc .tag.早餐{background:#fff1d6}.fc .tag.麵飯{background:#ffe8ec}.fc .tag.小吃{background:#e6f3ff}.fc .tag.甜點{background:#e3f8ef}
.fc .eat{font-size:20px;margin:8px 0;background:#fffaf2;border-radius:14px;padding:8px 12px}
.fc .eat b{color:#e0566a}
.fc .meta{font-size:17px;color:var(--soft);margin:6px 0}
.open{color:#fff;background:var(--ok);font-weight:900;border-radius:999px;padding:1px 10px}.closed{color:#fff;background:#c9a9a6;font-weight:900;border-radius:999px;padding:1px 10px}
.fc .acts{margin-top:8px}.fc .btn{min-height:50px;font-size:18px}
@media(prefers-reduced-motion:no-preference){.puff{animation:puff 2.4s ease-in-out infinite}.puff.b{animation-delay:1.2s}@keyframes puff{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(-6px,-18px);opacity:0}}.wheel{animation:bob 1.2s ease-in-out infinite;transform-origin:center}@keyframes bob{50%{transform:translateY(-2px)}}}
.eta{display:grid;gap:10px;margin-top:12px}
.er{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:#fffaf2;border-radius:18px;padding:10px 14px}
.er .no{background:var(--mint);color:#fff;font-weight:900;font-size:24px;border-radius:14px;padding:4px 12px;min-width:76px;text-align:center}
.er .to{font-size:19px;line-height:1.3}.er .to small{display:block;color:var(--soft);font-size:15px}
.er .t{font-weight:900;font-size:24px;white-space:nowrap;text-align:right}.er .t.soon{color:#fff;background:var(--hot);border-radius:12px;padding:2px 10px}.er .t.off{color:var(--soft);font-size:17px}
</style>
</head>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOME='新北市土城區學府路一段98巷30之1號';
const gdir=(d,m)=>`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(HOME)}&destination=${encodeURIComponent(d)}&travelmode=${m}`;
const gsearch=q=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;

/* ---------- 分頁 ---------- */
const tabs=[['tab-go','p-go'],['tab-food','p-food']];
const show=id=>{tabs.forEach(([t,p])=>{const on=t===id;$(t).setAttribute('aria-selected',on);$(p).hidden=!on});try{localStorage.setItem('tab',id)}catch(e){}window.scrollTo(0,0)};
tabs.forEach(([t])=>$(t).addEventListener('click',()=>show(t)));
try{const t=localStorage.getItem('tab');if(t&&$(t))show(t)}catch(e){}

/* ---------- 台北捷運路網 ---------- */
const LINES=[
 {n:'板南線',c:'#0070bd',s:'頂埔 永寧 土城 海山 亞東醫院 府中 板橋 新埔 江子翠 龍山寺 西門 台北車站 善導寺 忠孝新生 忠孝復興 忠孝敦化 國父紀念館 市政府 永春 後山埤 昆陽 南港 南港展覽館'},
 {n:'淡水信義線',c:'#e3002c',s:'象山 台北101/世貿 信義安和 大安 大安森林公園 東門 中正紀念堂 台大醫院 台北車站 中山 雙連 民權西路 圓山 劍潭 士林 芝山 明德 石牌 唭哩岸 奇岩 北投 復興崗 忠義 關渡 竹圍 紅樹林 淡水'},
 {n:'新北投支線',c:'#fd92a3',s:'北投 新北投'},
 {n:'松山新店線',c:'#008659',s:'新店 新店區公所 七張 大坪林 景美 萬隆 公館 台電大樓 古亭 中正紀念堂 小南門 西門 北門 中山 松江南京 南京復興 台北小巨蛋 南京三民 松山'},
 {n:'小碧潭支線',c:'#cfdb00',s:'七張 小碧潭'},
 {n:'中和新蘆線',c:'#f8b61c',s:'南勢角 景安 永安市場 頂溪 古亭 東門 忠孝新生 松江南京 行天宮 中山國小 民權西路 大橋頭 三重國小 三和國中 徐匯中學 三民高中 蘆洲'},
 {n:'中和新蘆線',c:'#f8b61c',s:'南勢角 景安 永安市場 頂溪 古亭 東門 忠孝新生 松江南京 行天宮 中山國小 民權西路 大橋頭 台北橋 菜寮 三重 先嗇宮 頭前庄 新莊 輔大 丹鳳 迴龍'},
 {n:'文湖線',c:'#c48c31',s:'動物園 木柵 萬芳社區 萬芳醫院 辛亥 麟光 六張犁 科技大樓 大安 忠孝復興 南京復興 中山國中 松山機場 大直 劍南路 西湖 港墘 文德 內湖 大湖公園 葫洲 東湖 南港軟體園區 南港展覽館'},
 {n:'環狀線',c:'#ffdb00',s:'大坪林 十四張 秀朗橋 景平 景安 中和 橋和 中原 板新 板橋 新埔民生 頭前庄 幸福 新北產業園區'},
 {n:'機場捷運',c:'#8246af',s:'台北車站 三重 新北產業園區 新莊副都心 泰山 泰山貴和 體育大學 長庚醫院 林口 山鼻 坑口 機場第一航廈 機場第二航廈'}
].map((l,i)=>({...l,id:i,st:l.s.split(' ')}));
const ADJ={};
LINES.forEach(l=>l.st.forEach((s,i)=>{ADJ[s]=ADJ[s]||[];if(i>0)ADJ[s].push([l.st[i-1],l.id]);if(i<l.st.length-1)ADJ[s].push([l.st[i+1],l.id])}));
const ALL=Object.keys(ADJ);

// 最少轉乘的路線（每站 1 分、每次轉車 6 分）
function route(a,b){
 const key=(s,ln)=>s+'|'+(ln==null?'':LINES[ln].n);
 const dist={},prev={},Q=[[0,a,null]];dist[key(a,null)]=0;
 while(Q.length){
  Q.sort((x,y)=>x[0]-y[0]);const [d,s,ln]=Q.shift();
  if(s===b){const path=[];let k=key(s,ln),cur=[s,ln];while(cur){path.unshift(cur);cur=prev[key(cur[0],cur[1])]}return path}
  if(d>dist[key(s,ln)])continue;
  for(const [t,l2] of ADJ[s]){const nd=d+1+(ln!=null&&LINES[ln].n!==LINES[l2].n?6:0);const k=key(t,l2);
   if(dist[k]==null||nd<dist[k]){dist[k]=nd;prev[k]=[s,ln];Q.push([nd,t,l2])}}
 }return null;
}
// 把路線整理成「坐哪條線、往哪個方向、坐幾站」
function legs(path){
 const out=[];
 for(let i=1;i<path.length;i++){const [s,l]=path[i],from=path[i-1][0];const last=out[out.length-1];
  if(last&&LINES[last.l].n===LINES[l].n){last.to=s;last.n++;last.lines.add(l)}else out.push({l,from,to:s,n:1,lines:new Set([l])})}
 return out.map(g=>{
  const name=LINES[g.l].n;const ends=new Set();
  g.lines.forEach(id=>{const st=LINES[id].st;if(!st.includes(g.from)||!st.includes(g.to))return;ends.add(st.indexOf(g.to)>st.indexOf(g.from)?st[st.length-1]:st[0])});
  // 中和新蘆線兩條分支共用的一段：兩個方向都可以坐
  const trunk=LINES[5].st.slice(0,12);
  if(name==='中和新蘆線'&&trunk.includes(g.from)&&trunk.includes(g.to)&&trunk.indexOf(g.to)>trunk.indexOf(g.from)){ends.clear();ends.add('蘆洲 或 迴龍')}
  return{name,c:LINES[g.l].c,from:g.from,to:g.to,n:g.n,dir:[...ends][0]||''};
 });
}

/* ---------- 地名 → 捷運站 ---------- */
const PLACES={
 '台北101':['台北101/世貿'],'101':['台北101/世貿'],'世貿':['台北101/世貿'],'信義商圈':['市政府','出站就是信義商圈，百貨公司很多。'],'象山':['象山','出站走到象山步道入口約 10 分鐘，山路有很多樓梯，量力而為。'],
 '西門町':['西門','6 號出口出來就是西門町。'],'士林夜市':['劍潭','1 號出口過馬路就是士林夜市。'],'故宮':['士林','出站後換坐公車到故宮（站牌寫「故宮博物院」）。'],
 '動物園':['動物園','出站就到動物園門口，園區很大可以坐園內遊園車。'],'貓空':['動物園','出站往貓空纜車站走約 5 分鐘，坐纜車上山。'],
 '淡水老街':['淡水','出站往河邊走就是老街。'],'漁人碼頭':['淡水','出站坐紅26 公車或渡船到漁人碼頭。'],
 '中正紀念堂':['中正紀念堂','5 號出口出來就是。'],'自由廣場':['中正紀念堂'],'總統府':['台大醫院'],'228公園':['台大醫院'],'二二八公園':['台大醫院'],
 '龍山寺':['龍山寺','1 號出口出來就看到龍山寺。'],'國父紀念館':['國父紀念館'],'行天宮':['行天宮','4 號出口走一下就到。'],
 '饒河夜市':['松山','5 號出口出來就是饒河夜市和慈祐宮。'],'寧夏夜市':['雙連','出站往民生西路走約 8 分鐘。'],'大稻埕':['北門','出站往迪化街方向走約 10 分鐘。'],'迪化街':['北門','出站往迪化街方向走約 10 分鐘。'],
 '北投溫泉':['新北投','出站就是溫泉區和北投公園。'],'天母':['芝山','出站換公車到天母。'],'榮總':['石牌','出站有醫院接駁車到台北榮總。'],

// 整理成好唸的句子
const clean=t=>t.replace(/\//g,'').replace(/～/g,'到').replace(/[^\p{L}\p{N}，。、！？：（）「」\s]/gu,'').replace(/[（）「」]/g,'，').replace(/，+/g,'，').replace(/\s+/g,'');
// 每段不超過 150 字（Google 一次只能唸一小段）
const chunks=t=>{const out=[];let cur='';for(const part of clean(t).split(/(?<=[。！？])/)){if(!part)continue;if((cur+part).length>150){if(cur)out.push(cur);cur=''}
 if(part.length>150){part.split(/(?<=，)/).forEach(x=>{if((cur+x).length>150){out.push(cur);cur=''}cur+=x})}else cur+=part}if(cur)out.push(cur);return out};
const audio=new Audio();let queue=[],playing=false,sayBtn=null;
const gurl=t=>'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-TW&ttsspeed=0.9&q='+encodeURIComponent(t);
const setBtn=on=>{playing=on;if(sayBtn)sayBtn.textContent=on?'⏹️ 停止':'🔊 唸給我聽'};
function stop(){queue=[];audio.pause();if('speechSynthesis' in window)speechSynthesis.cancel();setBtn(false)}
function next(){if(!queue.length){setBtn(false);return}const t=queue.shift();audio.src=gurl(t);audio.play().catch(()=>{queue.unshift(t);fallback()})}
audio.addEventListener('ended',next);
audio.addEventListener('error',()=>{if(playing)fallback(audio.src?decodeURIComponent(audio.src.split('&q=')[1]||''):'')});
// 備用：手機內建語音（優先挑 Google 的中文聲音）
let voice=null;const pick=()=>{const vs=speechSynthesis.getVoices(),zh=vs.filter(v=>/zh[-_](TW|Hant)/i.test(v.lang)||/國語|臺灣|台灣/.test(v.name));voice=zh.find(v=>/google/i.test(v.name))||zh.find(v=>/美佳|Mei-?Jia|Meijia/i.test(v.name))||zh[0]||vs.find(v=>/^zh/i.test(v.lang))||null};
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}
function fallback(first){
 if(!('speechSynthesis' in window)){setBtn(false);return}
 const rest=(first?[first]:[]).concat(queue);queue=[];speechSynthesis.cancel();
 rest.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.95;if(voice)u.voice=voice;if(i===rest.length-1)u.onend=()=>setBtn(false);speechSynthesis.speak(u)});
}
function speak(t,btn){if(playing){stop();return}sayBtn=btn||null;queue=chunks(t);if(!queue.length)return;setBtn(true);next()}

 const rows=busData.stops[curStop].filter(r=>{const key=r.route+'|'+r.to;if(seen.has(key))return false;seen.add(key);return true});
 $('eta').innerHTML='<div class="eta">'+rows.map(r=>{const [t,c]=etaText(r.sec,age);return`<div class="er"><span class="no">${esc(r.route)}</span><span class="to">往 ${esc(r.to||'—')}</span><span class="t ${c}">${esc(t)}</span></div>`}).join('')+'</div>';
 const mins=Math.round(age/60);
 $('etaNote').textContent=`資料來源：新北市政府開放資料，${mins<1?'剛剛':mins+' 分鐘前'}更新（時間已經幫你扣掉了）。每分鐘自動重新整理。`;
}
async function loadBus(){
 try{const r=await fetch(BUS_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;busData=await r.json();drawEta()}
 catch(e){if(!busData){$('eta').innerHTML='<p>公車資料暫時讀不到，可以先按下面的「看公車怎麼坐」用地圖查。</p>'}}
}
$('stops').addEventListener('click',e=>{const b=e.target.closest('button');if(b){curStop=b.dataset.s;drawEta()}});
loadBus();setInterval(()=>{if(!document.hidden)loadBus()},60000);

/* ---------- 美食 ---------- */
// 美食資料放在 food.json（可以用 admin.html 後台修改）
let FOOD=[],FCATS=['早餐','麵飯','小吃','甜點'];
const parseH=h=>(h||'').split(/[,，、]/).map(x=>x.trim()).filter(Boolean).map(r=>r.split(/[-~～]/).map(t=>{const [H,M]=t.trim().split(/[:：]/);return +H+(+M||0)/60})).filter(r=>r.length===2&&r.every(x=>!isNaN(x)));
const CATS=()=>['全部','現在有開',...FCATS];
let fc='全部';
const now=()=>{const d=new Date();return{day:d.getDay(),t:d.getHours()+d.getMinutes()/60}};
const status=f=>{const H=parseH(f.h);if(!H.length)return null;const {day,t}=now();if((f.off||[]).includes(day))return false;return H.some(([a,b])=>t>=a&&t<b)};
const fmt=x=>`${Math.floor(x)}:${String(Math.round(x%1*60)).padStart(2,'0')}`;
const hours=f=>{const w='日一二三四五六',H=parseH(f.h);let s=H.length?H.map(([a,b])=>fmt(a)+'～'+fmt(b)).join('、'):'營業時間不確定';if((f.off||[]).length)s+=`（星期${f.off.map(d=>w[d]).join('、')}休息）`;return s};
function drawFood(){
 $('fcat').innerHTML=CATS().map(c=>`<button type="button" aria-pressed="${c===fc}" data-c="${c}">${c==='現在有開'?'🟢 ':''}${c}</button>`).join('');
 const list=FOOD.filter(f=>fc==='全部'||(fc==='現在有開'?status(f)===true:f.c===fc));
 $('flist').innerHTML=list.length?list.map(f=>{const st=status(f);return`<article class="fc">
  <div class="top"><h3>${esc(f.n)}</h3><span class="tag ${esc(f.c)}">${esc(f.c)}</span></div>
  <p class="eat">🍽️ ${esc(f.eat)}${f.price?` <b>${esc(f.price)}</b>`:''}</p>
  <p class="meta">${st===true?'<span class="open">● 現在有開</span>　':st===false?'<span class="closed">● 現在沒開</span>　':''}🕐 ${esc(hours(f))}</p>
  <p class="meta">📍 土城區${esc(f.a)}${f.t?'　☎ '+esc(f.t):''}</p>
  ${f.why?`<p class="meta">💬 ${esc(f.why)}</p>`:''}
  <div class="acts"><a class="btn" href="${gsearch('土城 '+f.n.replace(/（.*）/,''))}">🗺️ 地圖</a><a class="btn ghost" href="${gdir('新北市土城區'+f.a,'walking')}">🚶 從家走過去</a></div>
 </article>`}).join(''):'<section class="card"><p>現在這個時間沒有店開著，晚一點再看看！</p></section>';
}
$('fcat').addEventListener('click',e=>{const b=e.target.closest('button');if(b){fc=b.dataset.c;drawFood()}});
fetch('food.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{FOOD=d.items||[];if(d.categories&&d.categories.length)FCATS=d.categories;drawFood()}).catch(()=>{$('flist').innerHTML='<section class="card"><p>美食清單暫時讀不到，晚一點再看看。</p></section>'});
}
</script>
