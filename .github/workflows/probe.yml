name: probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for U in https://tcgbusfs.blob.core.windows.net/ntpcbus/GetEstimateTime.gz https://tcgbusfs.blob.core.windows.net/blobbus/GetEstimateTime.gz https://tcgbusfs.blob.core.windows.net/ntpcbus/GetStop.gz https://tcgbusfs.blob.core.windows.net/ntpcbus/GetRoute.gz; do
            echo "== $U"; curl -s -D /tmp/h -o /tmp/b -H "Origin: https://coolalxeanderyi.github.io" "$U" -w "bytes=%{size_download} time=%{time_total}\n"; grep -i -E "^HTTP|access-control|last-modified|content-type|content-encoding" /tmp/h
            (gunzip -c /tmp/b 2>/dev/null || cat /tmp/b) | head -c 300; echo
          done
          echo "== preflight-free GET from browser needs ACAO; OPTIONS test"; curl -s -i -X OPTIONS -H "Origin: https://coolalxeanderyi.github.io" -H "Access-Control-Request-Method: GET" https://tcgbusfs.blob.core.windows.net/ntpcbus/GetEstimateTime.gz | head -12
