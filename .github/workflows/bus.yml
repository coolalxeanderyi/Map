name: 更新公車站牌清單
# 只整理「這兩個站牌有哪些公車」，一天一次就夠；即時到站時間由網頁直接抓。
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build_stops.py", ".github/workflows/bus.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build_stops.py stops.json
      - name: 存到 data 分支
        run: |
          mkdir out && cp stops.json out/ && cd out
          git init -q -b data && git add stops.json
          git -c user.name="bus-bot" -c user.email="bus-bot@users.noreply.github.com" commit -q -m "stops $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
